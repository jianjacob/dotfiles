#cloud-config
#
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                   VPS Security Hardening - Cloud-Init                        ║
# ║                                                                              ║
# ║  Compatible: Ubuntu 20.04 / 22.04 / 24.04                                    ║
# ║  Providers:  Oracle OCI, DigitalOcean, Racknerd, Linode, Vultr, any VPS      ║
# ║  Author: jianjacob + (ai)                                                    ║
# ║  License: MIT License                                                        ║
# ║                                                                              ║
# ║  BEFORE USING:                                                               ║
# ║  1. Replace YOUR_SSH_PUBLIC_KEY_HERE with your actual SSH public key         ║
# ║  2. Adjust hostname and timezone if needed                                   ║
# ║  3. Configure Tailscale settings (optional)                                  ║
# ║                                                                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# Usage:
#   1. Edit this file with your SSH key and preferences
#   2. Paste into cloud provider's "User Data" or "Cloud-Init" field
#   3. Launch instance - hardening happens automatically on first boot
#   4. Wait 3-5 minutes for complete setup
#   5. SSH in as ubuntu user: ssh ubuntu@YOUR_IP

# ══════════════════════════════════════════════════════════════════════════════
# BASIC CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# Edit the hostname and timezone if needed
hostname: secure-vps
timezone: America/New_York
manage_etc_hosts: true

# Disable password authentication from the start
ssh_pwauth: false
disable_root: true

# ══════════════════════════════════════════════════════════════════════════════
# USER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

users:
  - name: ubuntu
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    lock_passwd: true
    ssh_authorized_keys:
      # REPLACE THIS WITH YOUR ACTUAL SSH PUBLIC KEY
      - YOUR_SSH_PUBLIC_KEY_HERE
      # Example format:
      # - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFoo... your-email@example.com
      # - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAAB... laptop-key
      
      # You can add multiple keys:
      # - ssh-ed25519 AAAAC3... work-computer
      # - ssh-ed25519 AAAAC3... personal-laptop

# ══════════════════════════════════════════════════════════════════════════════
# TAILSCALE CONFIGURATION (Optional)
# ══════════════════════════════════════════════════════════════════════════════
# 
# To enable Tailscale:
#   1. Set INSTALL_TAILSCALE to "true" in bootcmd section (remove quotes, lowercase)
#   2. Get auth key from: https://login.tailscale.com/admin/settings/keys
#   3. Replace YOUR_TAILSCALE_AUTH_KEY below
#   4. Set a unique hostname for this node
#   5. (Optional) Set SETUP_EXIT_NODE to "false" if you don't want exit node functionality
#
# To disable Tailscale:
#   1. Set INSTALL_TAILSCALE to "false"
#   2. Ignore auth_key, hostname, and SETUP_EXIT_NODE settings
# ══════════════════════════════════════════════════════════════════════════════

# Set to true or false (no quotes)
bootcmd:
  - echo "INSTALL_TAILSCALE=false" >> /etc/environment
  - echo "SETUP_EXIT_NODE=true" >> /etc/environment
  - echo "TAILSCALE_AUTH_KEY=YOUR_TAILSCALE_AUTH_KEY" >> /etc/environment
  - echo "TAILSCALE_HOSTNAME=secure-vps" >> /etc/environment

# ══════════════════════════════════════════════════════════════════════════════
# SYSTEM CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

package_update: true
package_upgrade: true
package_reboot_if_required: false

packages:
  - ufw
  - fail2ban
  - curl
  - unattended-upgrades
  - vim
  - htop
  - net-tools

# ══════════════════════════════════════════════════════════════════════════════
# CONFIGURATION FILES
# ══════════════════════════════════════════════════════════════════════════════

write_files:
  # ────────────────────────────────────────────────────────────────────────────
  # SSH Hardening Configuration
  # ────────────────────────────────────────────────────────────────────────────
  - path: /etc/ssh/sshd_config.d/99-security-hardening.conf
    permissions: '0644'
    content: |
      # Security hardening configuration
      # Generated by cloud-init hardening
      # Loads last due to 99- prefix
      # Do not edit manually
      
      # Disable password authentication - keys only
      PasswordAuthentication no
      ChallengeResponseAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      
      # Disable root login
      PermitRootLogin no
      
      # Enable public key authentication
      PubkeyAuthentication yes
      
      # Limit authentication attempts
      MaxAuthTries 3
      MaxSessions 4
      
      # Disable X11 forwarding
      X11Forwarding no
      
      # Stricter settings
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # ────────────────────────────────────────────────────────────────────────────
  # Override cloud-init's SSH defaults
  # ────────────────────────────────────────────────────────────────────────────
  - path: /etc/cloud/cloud.cfg.d/99-disable-ssh-password.cfg
    permissions: '0644'
    content: |
      #cloud-config
      ssh_pwauth: false
      disable_root: true

  # ────────────────────────────────────────────────────────────────────────────
  # Fail2ban SSH Jail Configuration
  # ────────────────────────────────────────────────────────────────────────────
  - path: /etc/fail2ban/jail.d/sshd-custom.conf
    permissions: '0644'
    content: |
      # SSH protection jail
      # Generated by cloud-init hardening
      # Do not edit manually
      
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      logpath = /var/log/auth.log
      backend = systemd
      
      # Ban settings
      maxretry = 5
      findtime = 600
      bantime = 3600
      
      # Aggressive mode for repeated offenders
      bantime.increment = true
      bantime.factor = 2
      bantime.maxtime = 86400

  # ────────────────────────────────────────────────────────────────────────────
  # Automatic Security Updates
  # ────────────────────────────────────────────────────────────────────────────
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";

  - path: /etc/apt/apt.conf.d/50unattended-upgrades
    permissions: '0644'
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Automatic-Reboot-Time "03:00";

  # ────────────────────────────────────────────────────────────────────────────
  # Tailscale Setup Script (runs conditionally)
  # ────────────────────────────────────────────────────────────────────────────
  - path: /usr/local/bin/setup-tailscale.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      
      # Load configuration
      source /etc/environment
      
      # Check if Tailscale installation is requested
      if [ "${INSTALL_TAILSCALE:-false}" != "true" ]; then
          echo "$(date): Tailscale installation skipped (INSTALL_TAILSCALE not true)" >> /var/log/tailscale-setup.log
          exit 0
      fi
      
      echo "$(date): Starting Tailscale installation" >> /var/log/tailscale-setup.log
      
      # Validate auth key
      if [ -z "${TAILSCALE_AUTH_KEY:-}" ] || [ "${TAILSCALE_AUTH_KEY}" = "YOUR_TAILSCALE_AUTH_KEY" ]; then
          echo "$(date): ERROR - No valid Tailscale auth key provided" >> /var/log/tailscale-setup.log
          echo "Get an auth key from: https://login.tailscale.com/admin/settings/keys" >> /var/log/tailscale-setup.log
          exit 1
      fi
      
      # Install Tailscale
      echo "$(date): Downloading and installing Tailscale..." >> /var/log/tailscale-setup.log
      if curl -fsSL https://tailscale.com/install.sh | sh >> /var/log/tailscale-setup.log 2>&1; then
          echo "$(date): Tailscale installed successfully" >> /var/log/tailscale-setup.log
      else
          echo "$(date): ERROR - Tailscale installation failed" >> /var/log/tailscale-setup.log
          exit 1
      fi
      
      # Check if exit node setup is requested
      SETUP_EXIT_NODE="${SETUP_EXIT_NODE:-true}"
      
      if [ "$SETUP_EXIT_NODE" = "true" ]; then
          echo "$(date): Configuring as exit node..." >> /var/log/tailscale-setup.log
          
          # Enable IP forwarding
          echo "$(date): Enabling IP forwarding..." >> /var/log/tailscale-setup.log
          echo 'net.ipv4.ip_forward = 1' >> /etc/sysctl.conf
          echo 'net.ipv6.conf.all.forwarding = 1' >> /etc/sysctl.conf
          sysctl -p >> /var/log/tailscale-setup.log 2>&1
      fi
      
      # Add Tailscale port to firewall
      echo "$(date): Adding Tailscale to UFW..." >> /var/log/tailscale-setup.log
      ufw allow 41641/udp comment 'Tailscale' >> /var/log/tailscale-setup.log 2>&1
      
      # Build tailscale up command
      TS_CMD="tailscale up --authkey=${TAILSCALE_AUTH_KEY} --hostname=${TAILSCALE_HOSTNAME:-$(hostname)} --accept-routes --ssh"
      
      if [ "$SETUP_EXIT_NODE" = "true" ]; then
          TS_CMD="$TS_CMD --advertise-exit-node"
      fi
      
      # Connect to Tailscale
      echo "$(date): Connecting to Tailscale network..." >> /var/log/tailscale-setup.log
      if eval "$TS_CMD" >> /var/log/tailscale-setup.log 2>&1; then
          echo "$(date): Tailscale connected successfully" >> /var/log/tailscale-setup.log
          
          # Get IP
          TS_IP=$(tailscale ip -4 2>/dev/null || echo "unknown")
          echo "$(date): Tailscale IP: $TS_IP" >> /var/log/tailscale-setup.log
          
          if [ "$SETUP_EXIT_NODE" = "true" ]; then
              echo "$(date): Exit node advertised - enable at: https://login.tailscale.com/admin/machines" >> /var/log/tailscale-setup.log
          fi
      else
          echo "$(date): ERROR - Tailscale connection failed" >> /var/log/tailscale-setup.log
          exit 1
      fi
      
      echo "$(date): Tailscale setup complete" >> /var/log/tailscale-setup.log

  # ────────────────────────────────────────────────────────────────────────────
  # Custom MOTD Banner
  # ────────────────────────────────────────────────────────────────────────────
  - path: /etc/update-motd.d/99-custom-security-banner
    permissions: '0755'
    content: |
      #!/bin/bash
      echo ""
      echo "╔══════════════════════════════════════════════════════════════════╗"
      echo "║          🔒 Secured VPS - Hardened Configuration                ║"
      echo "╚══════════════════════════════════════════════════════════════════╝"
      echo ""
      echo "Security features enabled:"
      echo "  ✓ SSH key authentication only (passwords disabled)"
      echo "  ✓ Root login disabled"
      echo "  ✓ Fail2ban active (brute-force protection)"
      echo "  ✓ UFW firewall enabled"
      echo "  ✓ Automatic security updates"
      
      # Check if Tailscale is installed
      if command -v tailscale &>/dev/null; then
          echo "  ✓ Tailscale VPN installed"
          ts_status=$(tailscale status --self 2>/dev/null | head -1 || echo "")
          if [ -n "$ts_status" ]; then
              echo "    → Connected: $ts_status"
          fi
      fi
      
      echo ""
      echo "For admin tasks: sudo your-command"
      echo "To become root:  sudo su -"
      echo ""
      echo "Logs: /var/log/cloud-init-output.log"
      echo "      /var/log/tailscale-setup.log"
      echo ""

# ══════════════════════════════════════════════════════════════════════════════
# BOOT COMMANDS (Run early in boot process)
# ══════════════════════════════════════════════════════════════════════════════

# bootcmd defined earlier to set environment variables

# ══════════════════════════════════════════════════════════════════════════════
# RUN COMMANDS (Main setup sequence)
# ══════════════════════════════════════════════════════════════════════════════

runcmd:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. System Preparation
  # ────────────────────────────────────────────────────────────────────────────
  - echo "$(date): Starting VPS hardening" >> /var/log/vps-hardening.log
  
  # ────────────────────────────────────────────────────────────────────────────
  # 2. Configure UFW Firewall
  # ────────────────────────────────────────────────────────────────────────────
  - echo "$(date): Configuring UFW firewall" >> /var/log/vps-hardening.log
  - ufw --force disable || true
  - ufw --force reset
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH'
  - ufw --force enable
  - systemctl enable ufw
  - echo "$(date): UFW configured" >> /var/log/vps-hardening.log
  
  # ────────────────────────────────────────────────────────────────────────────
  # 3. Configure Fail2ban
  # ────────────────────────────────────────────────────────────────────────────
  - echo "$(date): Starting Fail2ban" >> /var/log/vps-hardening.log
  - systemctl enable fail2ban
  - systemctl start fail2ban
  - sleep 2
  - systemctl status fail2ban >> /var/log/vps-hardening.log 2>&1 || true
  
  # ────────────────────────────────────────────────────────────────────────────
  # 4. Reload SSH with Hardened Configuration
  # ────────────────────────────────────────────────────────────────────────────
  - echo "$(date): Reloading SSH with security settings" >> /var/log/vps-hardening.log
  - systemctl reload ssh || systemctl reload sshd
  
  # ────────────────────────────────────────────────────────────────────────────
  # 5. Configure Unattended Upgrades
  # ────────────────────────────────────────────────────────────────────────────
  - echo "$(date): Configuring automatic updates" >> /var/log/vps-hardening.log
  - dpkg-reconfigure -plow unattended-upgrades
  
  # ────────────────────────────────────────────────────────────────────────────
  # 6. Optional Tailscale Setup
  # ────────────────────────────────────────────────────────────────────────────
  - echo "$(date): Running Tailscale setup" >> /var/log/vps-hardening.log
  - /usr/local/bin/setup-tailscale.sh
  
  # ────────────────────────────────────────────────────────────────────────────
  # 7. Cleanup and Final Steps
  # ────────────────────────────────────────────────────────────────────────────
  - apt-get autoremove -y
  - apt-get autoclean -y
  
  # ────────────────────────────────────────────────────────────────────────────
  # 8. Log Final Status
  # ────────────────────────────────────────────────────────────────────────────
  - echo "$(date): VPS hardening complete" >> /var/log/vps-hardening.log
  - echo "SSH Config:" >> /var/log/vps-hardening.log
  - sshd -T | grep -E "passwordauth|rootlogin|pubkeyauth" >> /var/log/vps-hardening.log 2>&1
  - echo "UFW Status:" >> /var/log/vps-hardening.log
  - ufw status verbose >> /var/log/vps-hardening.log 2>&1
  - echo "Fail2ban Status:" >> /var/log/vps-hardening.log
  - fail2ban-client status sshd >> /var/log/vps-hardening.log 2>&1 || echo "Fail2ban not yet initialized" >> /var/log/vps-hardening.log

# ══════════════════════════════════════════════════════════════════════════════
# FINAL MESSAGE
# ══════════════════════════════════════════════════════════════════════════════

final_message: |
  ╔══════════════════════════════════════════════════════════════════════════════╗
  ║                    🛡️  VPS Security Hardening Complete                       ║
  ╚══════════════════════════════════════════════════════════════════════════════╝
  
  Your VPS has been secured with:
    ✓ SSH password authentication disabled
    ✓ Root login disabled
    ✓ Fail2ban protecting SSH
    ✓ UFW firewall active
    ✓ Automatic security updates enabled
  
  Connection Info:
    SSH:  ssh ubuntu@YOUR_IP
    Logs: /var/log/vps-hardening.log
          /var/log/tailscale-setup.log
  
  Cloud-init completed in $UPTIME seconds.
  
  Next Steps:
    1. SSH in as ubuntu user
    2. Verify security: sudo sshd -T | grep -E "passwordauth|rootlogin"
    3. Check Fail2ban: sudo fail2ban-client status sshd
    4. Check firewall: sudo ufw status
    5. If Tailscale installed: sudo tailscale status
  
  ══════════════════════════════════════════════════════════════════════════════